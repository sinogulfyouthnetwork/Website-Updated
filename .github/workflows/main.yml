name: 'Deploy Website'

# Static site — no build step. Uploads the repo root to GitHub Pages as-is.
on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v5
      - name: 'Configure Pages'
        uses: actions/configure-pages@v5
      - name: 'Upload artifact'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: 'Deploy'
        id: deployment
        uses: actions/deploy-pages@v4
